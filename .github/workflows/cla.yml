# Contributor License Agreement check (CLA.md).
#
# TODO(owner): before enabling this workflow:
#   1. Approve CLA.md after legal review.
#   2. Replace the placeholder commit below with the full commit SHA of the
#      contributor-assistant/github-action release you reviewed (keep the
#      version comment). The all-zero placeholder cannot resolve, so the job
#      fails instead of running an unreviewed action.
#   3. Replace TODO-owner-login in the allowlist with your GitHub login.
#   4. Create the `cla-signatures` branch (an orphan branch is fine) and
#      protect it so only this workflow's token can push to it.
#
# Safety: this runs on pull_request_target, so it has a write token while
# handling untrusted pull requests. It must never check out or run pull
# request code; it only reads the PR metadata and writes signatures to the
# cla-signatures branch. tests/test_policy_files.py enforces that.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check and record CLA signatures
        uses: contributor-assistant/github-action@0000000000000000000000000000000000000000 # TODO(owner): pin a reviewed release (v2.x)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Velstra/sentinel/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'TODO-owner-login,dependabot[bot],github-actions[bot],renovate[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/Velstra/sentinel/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
