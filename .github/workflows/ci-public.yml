name: Public CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-verifier:
    name: Kernel verifier (${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6-6', '6-12', '6-18']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          enable_kvm: true
      - name: Require real KVM access
        run: |
          test -c /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Load the exact shipped object in the selected guest kernel
        env:
          KERNEL: ${{ matrix.kernel }}
        run: |
          set -o pipefail
          nix build --cores 2 --max-jobs 1 -L \
            ".#checks.x86_64-linux.ebpf-verifier-$KERNEL" \
            --out-link "$RUNNER_TEMP/verifier-result" 2>&1 | tee "$RUNNER_TEMP/verifier.log"
          cp "$RUNNER_TEMP/verifier-result/verifier.json" "$RUNNER_TEMP/verifier.json"
      - name: Preserve actual kernel/object receipts and rejected-load diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-${{ matrix.kernel }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verifier.log
            ${{ runner.temp }}/verifier.json
          if-no-files-found: error
          retention-days: 30

  # The image's CVE fixes arrive through the nixpkgs pin; the nightly run turns
  # red when it ages past the window (STATIC-10). Also the image tooling's own
  # tests: CVE gate, closure check, seeding tool.
  input-freshness-and-image-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Image tooling unit tests
        run: |
          python3 -B -m unittest discover -s tests -p 'test_image_c*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_seed_image.py' -v
          python3 -B -m unittest discover -s tests -p 'test_input_freshness.py' -v
      - name: Locked inputs are immutable and nixpkgs is at most 21 days old
        run: python3 scripts/check_input_freshness.py --max-age-days 21

  release-signing-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      - name: Real synthetic signing controls (no production keys or boot claim)
        run: bash scripts/release-tools.sh python3 -B tests/release_signing_smoke.py

  repository-history:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prevent image history from being merged back
        run: |
          python3 -B -m unittest discover -s tests -p 'test_repository_hygiene.py' -v
          python3 -B -m unittest discover -s tests -p 'test_community_release.py' -v
          python3 -B -m unittest discover -s tests -p 'test_release_image_boot.py' -v
          python3 scripts/check_repository_hygiene.py --history

  rust:
    runs-on: ubuntu-latest
    env:
      SENTINEL_TEST_MKPASSWD_BIN: /usr/bin/mkpasswd
    steps:
      - uses: actions/checkout@v4
      - name: Install the real password-hashing test helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends whois
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Appliance fixture regressions
        run: python3 -B -m unittest nix.test_update_capacity nix.test_update_fixture nix.test_visible_mount nix.test_radio_units nix.test_ha_kernel_oracle -v
      - name: Immutable source cohort and legacy-fixture regressions
        run: python3 -B -m unittest discover -s tests -p 'test_source_pins.py' -v
      - name: Differential oracle must fail closed on missing or failing traffic
        run: |
          python3 -B -m unittest discover -s nix/conformance -v
          python3 -B -m unittest nix.test_nat_capacity_pressure -v

  source-sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: SBOM generator regression tests
        run: python3 -B -m unittest discover -s tests -p 'test_sbom.py' -v
      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.54.1
      - name: Generate CycloneDX source SBOM and provenance
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: python3 scripts/generate_sbom.py --syft "$SYFT_BIN" --output-dir "$RUNNER_TEMP/sentinel-source-sbom"
      - name: Retain source SBOM (not an image certificate)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-source-sbom-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sentinel-source-sbom/sbom.cdx.json
            ${{ runner.temp }}/sentinel-source-sbom/sbom.provenance.json
            ${{ runner.temp }}/sentinel-source-sbom/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
