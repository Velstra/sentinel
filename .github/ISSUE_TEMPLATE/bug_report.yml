name: Bug report
description: Report a reproducible functional failure, without secrets.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities or exposed credentials, use [private security reporting](https://github.com/Velstra/sentinel/security/advisories/new), not this public form.
        Do not attach raw images, unredacted configuration, support archives, passwords, tokens or private keys.
  - type: textarea
    id: identity
    attributes:
      label: Affected source and image
      description: Include the Sentinel version/commit, image SHA-256, kernel, architecture and relevant Fabric/Wren pins. State explicitly if these are unknown.
      placeholder: "Sentinel commit: …; image SHA-256: …; kernel: …; x86_64; VM or hardware: …"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the CLI commands or UI steps, sanitized configuration and topology needed to reproduce. Describe any security-sensitive impact privately instead.
      placeholder: "1. Start with …\n2. Apply …\n3. Send traffic from … to …"
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Distinguish configuration acceptance from actual traffic, service state or UI behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include the exact failing command/test, relevant logs, packet observations and whether the CLI and UI agree. Review every attachment for secrets first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed credentials, private keys, personal information and sensitive appliance data.
          required: true
